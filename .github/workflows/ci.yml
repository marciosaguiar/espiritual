name: CI

# Guards against the failure mode this project already hit: code sitting in the
# repository for months without compiling. Runs on every push and pull request.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Análise e testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # A VERSÃO É FIXA, e isto não é zelo.
          #
          # Com `channel: stable` sozinho, a ação baixa o último estável NO
          # MOMENTO DA EXECUÇÃO. O mesmo commit passa a gerar tamanhos
          # diferentes em dias diferentes, e o número medido fora da CI não
          # serve para comparar com o dela: foi assim que a trava do pacote
          # passou a recusar TODO deploy — a base tinha sido medida com uma
          # versão e a CI construía com outra, ~200 KB mais gorda.
          #
          # Trocar de versão aqui é decisão de quem lê o tamanho depois: suba
          # a versão e meça a base de novo, no mesmo movimento.
          flutter-version: '3.50.0'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: flutter pub get

      # Fails on real errors (the "it does not compile" case).
      # Warnings and lint hints are reported but do not block yet — tighten by
      # dropping these flags once the existing hints are cleaned up.
      - name: Analisar
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Testes
        run: flutter test

      # OS TESTES DE FORA DO FLUTTER TAMBÉM RODAM AQUI.
      #
      # Eles existiam só no workflow de publicação, junto da trava do
      # tamanho — e pelo mesmo motivo: quem olha o verde olha o CI. Um teste
      # do Worker quebrado passava sem ninguém ver.
      #
      # A publicação continua rodando os seus, porque lá eles são portão: o
      # que estiver quebrado não vai para o ar.
      - name: Testes do mini-servidor dos avisos
        run: node --test worker/teste/*.mjs

      - name: Testes do service worker
        run: node --test web/teste/*.mjs

      - name: Testes das rotinas diárias
        run: node --test ferramentas/teste/*.mjs

      # QUEM está medindo, impresso no log.
      #
      # Isto não é enfeite: é o passo que faltava. A trava foi fixada em
      # `flutter-version: '3.50.0'` e eu medi 3.668.988 bytes no meu
      # contêiner, enquanto a CI media 3.868.219 no mesmo commit — 199 KB de
      # diferença com a versão supostamente igual. A causa estava no SDK do
      # meu contêiner: framework de 9 dias atrás com motor e Dart de 14 meses
      # (Dart 3.9.0), ou seja, um `dart2js` velho gerando menos código.
      #
      # A lição: **a string da versão não basta**. Quem compila é o motor e o
      # Dart, e eles aparecem só nas outras linhas do `flutter --version`.
      # Com este passo, a próxima divergência se explica numa olhada em vez
      # de virar caça ao fantasma.
      - name: Qual Flutter está medindo
        run: |
          flutter --version
          echo "FLUTTER_ROOT=$FLUTTER_ROOT"
          dart --version

      - name: Tamanho do pacote inicial
        # A TRAVA DO TAMANHO MORA AQUI, e não só no deploy.
        #
        # Ela existia apenas no workflow de publicação, que ninguém abre — e o
        # CI, que é onde se olha, ficava verde enquanto TODO deploy falhava.
        # O app no ar ficou parado por dias sem nada vermelho aparecer no
        # lugar certo.
        #
        # As flags são as MESMAS da publicação, senão o número não é
        # comparável. (Medido: as flags mudam 73 bytes.)
        #
        # DE ONDE VEM A BASE, E POR QUE ELA SUBIU
        #
        # A base anterior (3.610.328) foi medida no site no ar em 15/11, com
        # outro conjunto de ferramentas. Com o Flutter 3.50.0 de verdade, o
        # MESMO app compila para ~3,86 MB: a diferença é o compilador, não o
        # código. Prova de que a CI está medindo o app, e não ruído: dois
        # commits seguidos deram 3.852.078 (60f377c) e 3.868.219 (83080d1), e
        # os 16 KB de diferença são exatamente o tamanho da tela de hinos que
        # entrou entre os dois.
        #
        # Então a base passou a ser o que a CI mediu, no commit 83080d1:
        # 3.868.219 bytes. Trocar `flutter-version` exige medir de novo AQUI,
        # e o passo acima diz com o quê.
        #
        # A trava não é orçamento de bytes bonito: ela existe para pegar
        # alguém transformando ATIVO em CÓDIGO sem perceber — a Bíblia são
        # 7,7 MB, e o salto apareceria na hora. A folga de 100 KB é o que uma
        # tela nova inteira pode custar sem que ninguém precise medir antes.
        run: |
          flutter build web --release --base-href "/espiritual/" \
            --pwa-strategy=none --no-web-resources-cdn
          # 19/11/2026: a biblioteca de hinários (tela de importar, tela de
          # leitura e motor de leitura) é código de verdade e acrescentou
          # 59.021 bytes (medido antes e depois, no mesmo Flutter). A CI
          # mediu 4.001.604 em c2f49ec, 30.985 acima do limite antigo, com a
          # análise e os testes verdes. O resto dos ~133 KB desde 83080d1 veio
          # das entregas anteriores, que já vinham comendo a folga.
          # A base passa a ser o que a CI mediu. Trocar nos DOIS workflows
          # (ci.yml e web-preview.yml), no mesmo commit.
          # 20/11/2026: a rodada "offline primeiro" é código de verdade (fila de
          # envio, política de conflito, cópia no aparelho, preparação em segundo
          # plano, faixa de rede, recados) e acrescentou 71.659 bytes (medido
          # antes e depois, no mesmo Flutter: 3.844.913 → 3.916.572). Na CI, com
          # o mesmo deslocamento de ~199 KB entre esta máquina e ela, isso dá
          # ~4.115.673 — 11 KB ACIMA do limite anterior (4.104.004).
          # ESTE NÚMERO É UMA ESTIMATIVA: a base passa a ser o que a CI imprimir
          # ("main.dart.js: N bytes") e vale conferir o log da primeira execução.
          # Trocar nos DOIS workflows (ci.yml e web-preview.yml), no mesmo commit.
          BASE=4115673
          FOLGA=102400
          TAMANHO=$(wc -c < build/web/main.dart.js)
          LIMITE=$((BASE + FOLGA))
          echo "main.dart.js: $TAMANHO bytes (limite $LIMITE, folga $((LIMITE - TAMANHO)))"
          if [ "$TAMANHO" -gt "$LIMITE" ]; then
            echo "::error::o pacote inicial passou de $LIMITE bytes ($TAMANHO)."
            echo "::error::Ou algo que devia ser ativo virou código, ou a"
            echo "::error::versão do Flutter mudou. Confira o passo"
            echo "::error::'Qual Flutter está medindo' acima: motor e Dart"
            echo "::error::contam, não só o 3.50.0. O número aqui é o oficial."
            exit 1
          fi
