name: Deploy web preview to GitHub Pages

# Builds the Flutter web demo (preview mode, no Firebase needed) and publishes
# it to GitHub Pages so it can be opened from any browser, including phones.

on:
  push:
    branches:
      - claude/magical-goodall-RnnCy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Enable web target
        run: flutter create --platforms=web .

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (preview demo)
        run: flutter build web --release --base-href "/espiritual/"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
