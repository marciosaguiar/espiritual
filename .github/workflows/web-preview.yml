name: Deploy web preview to GitHub Pages

# Builds the Flutter web demo (preview mode, no Firebase needed) and publishes
# it to GitHub Pages so it can be opened from any browser, including phones.

on:
  push:
    branches:
      - claude/levitasync-worship-app-TL9nC
      - claude/magical-goodall-RnnCy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # A VERSÃO É FIXA, e isto não é zelo.
          #
          # Com `channel: stable` sozinho, a ação baixa o último estável NO
          # MOMENTO DA EXECUÇÃO. O mesmo commit passa a gerar tamanhos
          # diferentes em dias diferentes, e o número medido fora da CI não
          # serve para comparar com o dela: foi assim que a trava do pacote
          # passou a recusar TODO deploy — a base tinha sido medida com uma
          # versão e a CI construía com outra, ~200 KB mais gorda.
          #
          # Trocar de versão aqui é decisão de quem lê o tamanho depois: suba
          # a versão e meça a base de novo, no mesmo movimento.
          flutter-version: '3.50.0'

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Testar o mini-servidor dos avisos
        # A cifra do Web Push não dá erro quando está errada: o serviço de
        # push aceita os bytes, o aviso chega ao aparelho e some sem nada na
        # tela. O teste faz o papel do aparelho e decifra de volta.
        run: node --test worker/teste/*.mjs

      - name: Testar o service worker
        # Ele decide qual etiqueta cada aviso usa e para onde vai quem toca.
        # Erro aqui não aparece na tela de ninguém: o aviso chega bonito e
        # leva à tela errada, ou um aviso apaga o outro e um pedido de
        # entrada se perde.
        run: node --test web/teste/*.mjs

      - name: Testar as rotinas diárias
        # O diagnóstico que a rotina imprime quando o Worker recusa: cada
        # status tem de levar ao conserto certo, senão o log volta a dizer
        # só um número.
        run: node --test ferramentas/teste/*.mjs

      - name: Build web
        # --pwa-strategy=none: o service worker que o Flutter gera hoje só se
        #   desregistra, e registrá-lo apagaria o nosso (web/sw.js), que é
        #   quem guarda o app no aparelho.
        # --no-web-resources-cdn: traz o canvaskit (1,5 MB) do nosso próprio
        #   site. Vindo do servidor do Google ele fica fora do nosso cache e
        #   é baixado de novo a cada abertura.
        run: >
          flutter build web --release --base-href "/espiritual/"
          --pwa-strategy=none --no-web-resources-cdn

      - name: Carimbar a versão e conferir o build
        # Três conferências que transformam em build vermelho o que antes
        # passava calado. Foi assim que o app perdeu o cache: uma versão nova
        # do Flutter trocou o service worker por um que só se desregistra,
        # tudo continuou "funcionando", e a abertura passou a demorar 5
        # segundos no celular.
        run: |
          set -e

          # 1. A lista do que guardar sai do build, não escrita à mão: os
          #    nomes mudam entre versões do Flutter, e um arquivo esquecido
          #    (foi o canvaskit) faz o app não abrir sem internet.
          node -e '
            const fs = require("fs"), p = require("path");
            const raiz = "build/web";
            // Fora do cache: o que o app nunca pede. O Flutter publica
            // cinco variantes do canvaskit (36 MB somadas); ficam as duas
            // que são realmente carregadas — a do Safari, que é o caso do
            // iPhone, e a do Chrome. As outras três e o skwasm saem.
            // O que faltar continua vindo da rede na primeira vez e é
            // guardado depois.
            const fora = new RegExp(
              "^canvaskit/webparagraph/" +
              // A Bíblia são 7,7 MB de texto. Guardá-la na instalação faria
              // toda abertura de app pagar por uma tela que talvez nunca
              // seja aberta. Ela é guardada no aparelho quando a pessoa
              // abre a tradução pela primeira vez, pelo mesmo service
              // worker, no caminho de quando a página pede.
              "|^assets/assets/biblia/" +
              "|(^|/)(skwasm[^/]*|wimp\\.wasm|NOTICES|sw\\.js|\\.last_build_id)$");
            const arquivos = [];
            (function anda(dir) {
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                const caminho = p.join(dir, e.name);
                if (e.isDirectory()) { anda(caminho); continue; }
                const rel = p.relative(raiz, caminho).split(p.sep).join("/");
                if (!fora.test(rel)) arquivos.push(rel);
              }
            })(raiz);
            arquivos.unshift("./");
            const versao = (process.env.GITHUB_SHA || "sem-sha").slice(0, 12);
            const cabeca = "self.VERSAO_DO_BUILD = " + JSON.stringify(versao) +
              ";\nself.LISTA_DO_BUILD = " + JSON.stringify(arquivos) + ";\n";
            const alvo = "build/web/sw.js";
            fs.writeFileSync(alvo, cabeca + fs.readFileSync(alvo, "utf8"));
            console.log("sw.js: versão " + versao + ", " + arquivos.length + " arquivos no cache");
          '
          grep -q "VERSAO_DO_BUILD" build/web/sw.js || { echo "::error::sw.js saiu sem versão"; exit 1; }

          # 2. O canvaskit (1,5 MB) tem de vir do nosso site, senão fica fora
          #    do nosso cache e é baixado de novo a cada abertura.
          if ! grep -q 'useLocalCanvasKit":true' build/web/flutter_bootstrap.js; then
            echo "::error::o canvaskit voltou a vir do CDN do Google"
            exit 1
          fi
          test -f build/web/canvaskit/canvaskit.wasm

          # 3. O Flutter não pode registrar um service worker: seria por cima
          #    do nosso, e o dele hoje só se desregistra.
          if grep -qE 'serviceWorkerVersion: *"' build/web/flutter_bootstrap.js; then
            echo "::error::o Flutter voltou a registrar um service worker"
            exit 1
          fi

          # 4. O pacote inicial não pode engordar.
          #
          #    Tudo o que entra em main.dart.js é baixado antes da primeira
          #    tela. A Bíblia é ativo, baixada só quando a tela dela abre —
          #    se um dia alguém a transformar em código (uma lista embutida,
          #    um import que puxa o texto), isto aqui fica vermelho em vez de
          #    o app ficar lento para todo mundo.
          #
          #    BASE é o tamanho medido NA PRÓPRIA CI em 18/11/2026 (60f377c).
          #    A base antiga (3610328, medida no site em 15/11) ficou para trás:
          #    o Flutter estável da CI gera ~200 KB a mais que a máquina de
          #    desenvolvimento, e a trava passou a barrar toda publicação desde
          #    3251e74 sem que nenhum ativo tivesse virado código. Medir sempre
          #    aqui, nunca fora da CI.
          # 19/11/2026: a biblioteca de hinários (tela de importar, tela de
          # leitura e motor de leitura) é código de verdade e acrescentou
          # 59.021 bytes (medido antes e depois, no mesmo Flutter). A CI
          # mediu 4.001.604 em c2f49ec, 30.985 acima do limite antigo, com a
          # análise e os testes verdes. O resto dos ~133 KB desde 83080d1 veio
          # das entregas anteriores, que já vinham comendo a folga.
          # A base passa a ser o que a CI mediu. Trocar nos DOIS workflows
          # (ci.yml e web-preview.yml), no mesmo commit.
          BASE=4001604
          FOLGA=102400
          TAMANHO=$(wc -c < build/web/main.dart.js)
          LIMITE=$((BASE + FOLGA))
          echo "main.dart.js: $TAMANHO bytes (limite $LIMITE)"
          if [ "$TAMANHO" -gt "$LIMITE" ]; then
            echo "::error::o pacote inicial passou de $LIMITE bytes ($TAMANHO). Algo que devia ser ativo virou código."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
