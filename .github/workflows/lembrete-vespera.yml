name: Rotina diária (agenda + lembrete)

# Duas coisas, uma vez por dia, nesta ordem:
#
# 1. CRIAR OS CULTOS da agenda fixa que ainda não existem. O app já faz isso
#    quando um líder o abre, e a fragilidade era essa: sem ninguém abrir o
#    app por algumas semanas, a escala secava. Vem primeiro de propósito —
#    um culto criado agora para amanhã ainda recebe o lembrete no passo 2.
#
# 2. Avisar quem está escalado para o culto de amanhã, e pedir a confirmação
#    de quem ainda não confirmou.
#
# Este job não manda notificação: ele é o despertador. Quem manda é o Worker
# da Cloudflare, onde mora a chave privada do VAPID — ver os comentários em
# ferramentas/lembrete-vespera.mjs.
#
# Não há segredo novo: o robô é o mesmo líder da faxina do chat, e o endereço
# do Worker sai do próprio repositório.
#
# Enquanto os segredos não existirem, a rotina roda, diz que não está
# configurada e termina em verde.

on:
  schedule:
    # 20:37 UTC = 17:37 em Brasília. Fim da tarde, como combinado: dá tempo de
    # a pessoa ver antes da noite, e ainda de avisar o líder se não puder ir.
    #
    # O minuto não é 00 de propósito: quase todo cron do mundo cai no topo da
    # hora, e o GitHub atrasa esses.
    - cron: '37 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lembrete-vespera
  cancel-in-progress: false

jobs:
  lembrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Criar os cultos da agenda fixa
        working-directory: ferramentas
        # `continue-on-error` porque o lembrete NÃO pode depender disto: uma
        # falha na criação dos cultos silenciaria o aviso de quem já está
        # escalado para amanhã, que é o passo que as pessoas esperam.
        continue-on-error: true
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FAXINA_EMAIL: ${{ secrets.FAXINA_EMAIL }}
          FAXINA_SENHA: ${{ secrets.FAXINA_SENHA }}
          # Para gravar o carimbo de "rodou" em `saude/cultos`. Segredo que
          # JÁ EXISTE: é o mesmo que a faxina do chat usa.
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: node gerar-agenda.mjs

      - name: Avisar quem está escalado para amanhã
        working-directory: ferramentas
        env:
          # Público: já está no app, que é servido num site público.
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          # A conta do robô: um líder comum, não chave de administrador. É a
          # MESMA da faxina do chat.
          FAXINA_EMAIL: ${{ secrets.FAXINA_EMAIL }}
          FAXINA_SENHA: ${{ secrets.FAXINA_SENHA }}
          # Para o carimbo em `saude/vespera`. Segredo que já existe.
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        # Sem dependências: só `fetch`, que o Node 20 já tem.
        run: node lembrete-vespera.mjs
