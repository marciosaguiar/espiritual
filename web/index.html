<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Substituído pelo valor de --base-href no build (no GitHub Pages: /espiritual/). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
        content="Repertório, escala e conversas do ministério de louvor, num lugar só.">

  <!-- Sem viewport-fit=cover de propósito.
       Com ele, somado a status-bar-style=black-translucent, o app instalado no
       iPhone era desenhado mais largo que a tela: toda aba ficava cortada na
       borda direita (o sábado do calendário, o "+", o botão de enviar) e certa
       na esquerda. Sem o cover, o navegador mantém o app dentro da área
       segura, e não existe borda para transbordar. -->
  <!-- Sem maximum-scale de propósito: MEDIDO que o Flutter reescreve esta meta
       ao iniciar e a troca por maximum-scale=5.0, então pôr 1.0 aqui não tem
       efeito nenhum — e ainda daria falsa sensação de proteção. O que impede o
       zoom do iOS é a fonte de 16px nos campos, no estilo abaixo. Deixar o 5.0
       do Flutter também preserva o zoom com dois dedos, que importa para quem
       enxerga pouco. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Instalado na tela de início: abre sem a barra do navegador. É isto que
       também permite a notificação no iPhone (iOS 16.4+). -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "default" reserva a barra de status em vez de desenhar sob ela.
       "black-translucent" é depreciado e participava do mesmo defeito. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LevitaSync">
  <meta name="theme-color" content="#003C8F">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LevitaSync</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Abertura com a identidade do app enquanto o Flutter carrega.
       Sem isto o primeiro acesso mostra uma tela branca por alguns segundos,
       que num celular se lê como "não funcionou". */
    /* O iOS dá zoom automático ao focar um campo cuja fonte seja menor que
       16px — e, no app instalado na tela de início, esse zoom NÃO volta quando
       o teclado fecha: a tela fica cortada à direita e embaixo até recarregar.
       Era o que acontecia depois de digitar no cadastro, em Nova Música ou no
       Chat.

       O Flutter desenha o texto no canvas e mantém um campo invisível só para
       receber o teclado; a fonte dele vem do estilo do widget, que é menor que
       16px. Como esse campo não aparece, forçar 16px nele não muda nada do que
       se vê — só remove a causa do zoom. */
    input, textarea, select, [contenteditable],
    .flt-text-editing, flt-text-editing-host * {
      font-size: 16px !important;
    }

    /* Um app Flutter nunca precisa rolar a página de lado: se algum dia algo
       passar da largura, é defeito, e esta linha evita que vire tela cortada. */
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #003C8F; overflow-x: hidden;
    }
    #abertura {
      position: fixed; inset: 0; z-index: 2;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: linear-gradient(180deg, #003C8F 0%, #1565C0 55%, #8E0000 100%);
      color: #fff; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity .35s ease;
    }
    #abertura.sumindo { opacity: 0; pointer-events: none; }
    #abertura img { width: 76px; height: 76px; }
    #abertura .nome { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
    #abertura .sub { font-size: 13px; opacity: .72; margin-top: -10px; }
    #abertura .giro {
      width: 26px; height: 26px; margin-top: 14px;
      border: 2.5px solid rgba(255,255,255,.3);
      border-top-color: rgba(255,255,255,.85);
      border-radius: 50%; animation: girar 1s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #abertura .giro { animation-duration: 3s; }
      #abertura { transition: none; }
    }
  </style>
</head>
<body>
  <div id="abertura">
    <img src="icons/Icon-192.png" alt="">
    <div class="nome">LevitaSync</div>
    <div class="sub">Ministério de Louvor Unificado</div>
    <div class="giro"></div>
  </div>

  <script>
    // O Flutter avisa quando a primeira tela foi desenhada; só então a
    // abertura sai. Se algo der errado no caminho, ela some mesmo assim
    // depois de 12s, para não prender a pessoa numa tela de carregamento.
    function esconderAbertura() {
      var el = document.getElementById('abertura');
      if (!el || el.classList.contains('sumindo')) return;
      el.classList.add('sumindo');
      setTimeout(function () { el.remove(); }, 400);
    }
    window.addEventListener('flutter-first-frame', esconderAbertura);
    setTimeout(esconderAbertura, 12000);

    // ── Instalar na tela de início ────────────────────────────────────────
    // O Chrome dispara 'beforeinstallprompt' logo no carregamento, antes de o
    // Flutter existir, e o convite só pode ser aberto a partir desse evento
    // guardado. Por isso ele é capturado aqui e exposto ao app em duas
    // funções. O Safari não tem equivalente: lá o app mostra as instruções.
    var conviteInstalacao = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      conviteInstalacao = e;
    });
    window.addEventListener('appinstalled', function () {
      conviteInstalacao = null;
    });
    window.levitaPodeConvidar = function () { return !!conviteInstalacao; };

    // Já está instalado? 'display-mode: standalone' cobre Android e iOS novos;
    // navigator.standalone cobre os iPhones mais antigos.
    window.levitaEstaInstalado = function () {
      try {
        if (window.matchMedia('(display-mode: standalone)').matches) return true;
        if (window.matchMedia('(display-mode: fullscreen)').matches) return true;
        return navigator.standalone === true;
      } catch (e) { return false; }
    };

    // Safari de iPhone/iPad é o único caso sem convite nativo, e é onde as
    // instruções precisam ser específicas (botão Compartilhar).
    window.levitaEhSafariDeIphone = function () {
      try {
        var ua = navigator.userAgent;
        var tocaTela = window.matchMedia('(pointer: coarse)').matches;
        var ios = /iPhone|iPad|iPod/.test(ua) ||
                  (/Macintosh/.test(ua) && tocaTela); // iPad novo se diz Mac
        if (!ios) return false;
        if (!/Safari/.test(ua)) return false;
        return !/CriOS|FxiOS|EdgiOS|OPiOS|Chrome/.test(ua);
      } catch (e) { return false; }
    };
    window.levitaConvidarInstalacao = function () {
      if (!conviteInstalacao) return false;
      conviteInstalacao.prompt();
      conviteInstalacao = null;
      return true;
    };
  </script>

  <style>
    /* A faixa de atualização. Fica fora do Flutter de propósito: ela precisa
       aparecer mesmo se o app estiver ocupado, e é assunto da PÁGINA, não da
       tela. Discreta, acima da barra de abas, fora do caminho do polegar. */
    #levita-atualizar {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(96px + env(safe-area-inset-bottom, 0px));
      z-index: 9999;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(20, 24, 31, 0.94);
      color: #fff;
      font-family: Poppins, system-ui, sans-serif;
      font-size: 13.5px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }
    #levita-atualizar.aparecendo { display: flex; }
    #levita-atualizar span { flex: 1; }
    #levita-atualizar button {
      flex: none;
      font: inherit;
      font-weight: 600;
      color: #0E1116;
      background: #fff;
      border: 0;
      border-radius: 9px;
      padding: 7px 14px;
      cursor: pointer;
    }
    #levita-atualizar .depois {
      background: transparent;
      color: rgba(255, 255, 255, 0.65);
      padding: 7px 4px;
    }
  </style>

  <div id="levita-atualizar" role="status">
    <span>Nova versão disponível</span>
    <button type="button" class="depois" id="levita-depois">Depois</button>
    <button type="button" id="levita-agora">Atualizar</button>
  </div>

  <script>
    // Guarda o app no aparelho e avisa quando houver versão nova.
    //
    // O que estava errado: a versão nova era baixada e ficava ESPERANDO a
    // antiga soltar o controle. Num app instalado no iPhone, que o sistema
    // quase nunca encerra de verdade, ela podia esperar dias — "saí e entrei
    // três vezes e continua a versão velha". Agora a página percebe que há
    // uma esperando e mostra uma faixa.
    //
    // E nunca recarrega sozinha no meio do uso: alguém pode estar com a
    // cifra aberta tocando no culto. A exceção é estreita e está em
    // `podeAtualizarSozinho()`.
    (function () {
      if (!('serviceWorker' in navigator)) return;

      var faixa = document.getElementById('levita-atualizar');
      var botaoAgora = document.getElementById('levita-agora');
      var botaoDepois = document.getElementById('levita-depois');
      var jaRecarregou = false;
      var esperando = null;

      // A pessoa está no Início? O Dart avisa a cada troca de aba (ver
      // lib/core/platform/tela_atual.dart). Enquanto não avisar, assumimos
      // que não — errar para o lado de perguntar.
      window.levitaNoInicio = false;
      var ultimoToque = Date.now();
      ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (e) {
        window.addEventListener(e, function () { ultimoToque = Date.now(); },
          { passive: true, capture: true });
      });

      // Atualizar sem perguntar só quando não há nada a atrapalhar: a pessoa
      // está no Início, não tocou em nada há 5 segundos e a tela está à
      // vista. Em qualquer outro caso, quem decide é ela.
      function podeAtualizarSozinho() {
        return window.levitaNoInicio === true
          && document.visibilityState === 'visible'
          && (Date.now() - ultimoToque) > 5000;
      }

      function assumir() {
        if (!esperando) return;
        esperando.postMessage({ tipo: 'ATUALIZAR' });
        faixa.classList.remove('aparecendo');
      }

      function anunciar(trabalhador) {
        esperando = trabalhador;
        if (podeAtualizarSozinho()) { assumir(); return; }
        faixa.classList.add('aparecendo');
      }

      botaoAgora.addEventListener('click', assumir);
      botaoDepois.addEventListener('click', function () {
        faixa.classList.remove('aparecendo');
      });

      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (jaRecarregou) return;
        jaRecarregou = true;
        window.location.reload();
      });

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          // Pode já haver uma versão esperando desde a sessão anterior —
          // justamente o caso que obrigava a fechar o app duas vezes.
          if (reg.waiting && navigator.serviceWorker.controller) {
            anunciar(reg.waiting);
          }

          reg.addEventListener('updatefound', function () {
            var novo = reg.installing;
            if (!novo) return;
            novo.addEventListener('statechange', function () {
              // `installed` com um controlador já no lugar significa: há uma
              // versão nova pronta, esperando a vez. Sem controlador, é a
              // primeira instalação — não há o que anunciar.
              if (novo.state === 'installed' &&
                  navigator.serviceWorker.controller) {
                anunciar(novo);
              }
            });
          });
        }).catch(function (e) {
          // Sem cache o app continua funcionando, só mais devagar.
          console.warn('[levita] service worker não registrou:', e);
        });
      });

      // O iOS só procura versão nova numa carga de página de verdade, e um
      // app na tela de início quase nunca faz uma. Então perguntamos quando
      // ele volta ao primeiro plano — no máximo de 10 em 10 minutos.
      var ultimaConferida = Date.now();
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState !== 'visible') return;
        var agora = Date.now();
        if (agora - ultimaConferida < 600000) return;
        ultimaConferida = agora;
        navigator.serviceWorker.getRegistration().then(function (reg) {
          if (reg) reg.update();
        }).catch(function () { /* offline: tenta na próxima vez */ });
      });
    })();
  </script>

  <!-- Gravar e tocar voz. Carregado aqui, e não dentro do Flutter,
       porque MediaRecorder e <audio> são do navegador. -->
  <script src="audio.js"></script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
