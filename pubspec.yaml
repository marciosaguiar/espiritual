name: levitasync
description: LevitaSync - App completo para ministérios de louvor
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Só para desligar a integração com o histórico do navegador (ver main.dart).
  # Vem do SDK e tem versão para Android e iOS, onde as funções não fazem nada.
  flutter_web_plugins:
    sdk: flutter

  # Firebase: conta, banco de dados
  firebase_core: ^2.24.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.14.0

  # Estado
  provider: ^6.1.1

  # Guarda no aparelho: sessão, tema, músicas offline
  shared_preferences: ^2.2.2

  # Interface
  table_calendar: ^3.0.9

  # Utilidades
  url_launcher: ^6.2.2
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    # Os textos bíblicos. Ativo do Flutter, não código: na web o arquivo só é
    # baixado quando a tela de leitura pede, então não entra no pacote
    # inicial nem atrasa a abertura do app. Ver assets/biblia/LEIA-ME.md.
    - assets/biblia/blivre.json
    - assets/biblia/alm1911.json
    # Carregado sob demanda por `FonteMono`, e não declarado em `fonts:`.
    - assets/fonts/JetBrainsMono.ttf
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    # "Roboto" é o nome que o motor do Flutter na web procura para ter UMA
    # fonte de partida. Sem ela no pacote, ele BAIXA a Roboto de
    # fonts.gstatic.com na abertura — um servidor de fora, com conexão nova
    # (DNS, TCP, TLS: quatro viagens), no caminho de ligar o app. MEDIDO numa
    # linha de 4G ruim (1,6 Mbps, 150 ms): sem esse pedido o Dart começa 0,7 s
    # antes e o Início com dados chega 1,1 s antes, em toda abertura.
    #
    # O app inteiro já escreve em Poppins (`ThemeData.fontFamily`), então o que
    # entra aqui é só o NOME: uma cópia da Poppins com um único caractere (o
    # espaço), 616 bytes, derivada da Poppins (OFL) com `fontTools.subset`:
    #   python3 -m fontTools.subset assets/fonts/Poppins-Regular.ttf \
    #     --unicodes=U+0020 --output-file=assets/fonts/Roboto-minima.ttf \
    #     --layout-features= --no-hinting --name-IDs=
    # Apontar o nome para a Poppins-Regular inteira também funcionava, mas
    # fazia o navegador baixar 71 KB duas vezes.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-minima.ttf
    # A fonte da cifra (JetBrains Mono, largura fixa para o acorde ficar sobre
    # a sílaba; licença OFL em assets/fonts/JetBrainsMono-OFL.txt) NÃO está
    # aqui, de propósito: o que se declara em `fonts:` é baixado antes do
    # primeiro quadro, toda abertura. Ela é um ATIVO (acima) e é registrada
    # por `FonteMono` quando alguém abre uma cifra. Ver lib/core/utils/
    # fonte_mono.dart.
