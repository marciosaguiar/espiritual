name: levitasync
description: LevitaSync - App completo para ministérios de louvor
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Só para desligar a integração com o histórico do navegador (ver main.dart).
  # Vem do SDK e tem versão para Android e iOS, onde as funções não fazem nada.
  flutter_web_plugins:
    sdk: flutter

  # Firebase: conta, banco de dados
  firebase_core: ^2.24.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.14.0

  # Estado
  provider: ^6.1.1

  # Guarda no aparelho: sessão, tema, músicas offline
  shared_preferences: ^2.2.2

  # Interface
  table_calendar: ^3.0.9

  # Utilidades
  url_launcher: ^6.2.2
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    # Os textos bíblicos. Ativo do Flutter, não código: na web o arquivo só é
    # baixado quando a tela de leitura pede, então não entra no pacote
    # inicial nem atrasa a abertura do app. Ver assets/biblia/LEIA-ME.md.
    - assets/biblia/blivre.json
    - assets/biblia/alm1911.json
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    # Cifra: largura fixa para o acorde ficar sobre a sílaba (licença OFL em
    # assets/fonts/JetBrainsMono-OFL.txt). Courier não existe no Android.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
